
on:
  push:
    branches: 
      - main
  workflow_dispatch:


jobs:
  windows-test-job:
    runs-on: windows-latest

    steps:
      - name: Enable CL
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: ml64
        shell: bash
        run: which ml64

      - name: cl
        run: where cl

      - run: echo "Hello"

  linux-test-job:
    runs-on: ubuntu-latest
    
    steps:
      - run: echo "Hello"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          repository: LazyPanda07/HttpArena
          ref: fix-web-framework

      - name: Run
        run: ./scripts/validate.sh web-framework-python
      